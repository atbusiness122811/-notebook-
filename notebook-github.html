<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Notebook</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cover:#2F3E33;
    --cover-dark:#212D25;
    --paper:#F6F1E4;
    --paper-line:#E1D7BE;
    --ink:#2B2A24;
    --ink-soft:#6B6555;
    --brass:#B08D57;
    --brass-light:#CDA96E;
    --ribbon:#8B3A3A;
    --sage:#7C8B6F;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;height:100%;background:var(--cover-dark);}
  .nb-root{
    display:flex;
    height:100vh;
    background:var(--cover-dark);
    overflow:hidden;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }

  /* ---------- SPINE / NOTE LIST ---------- */
  .nb-spine{
    width:270px;
    min-width:200px;
    background:var(--cover);
    display:flex;
    flex-direction:column;
    position:relative;
    border-right:6px solid var(--cover-dark);
  }
  .nb-spine::before{
    content:'';
    position:absolute;
    left:14px;
    top:0;
    bottom:0;
    width:0;
    border-left:2px dashed rgba(208,193,149,0.28);
  }

  .nb-brand{
    padding:22px 20px 14px 32px;
    color:var(--brass-light);
  }
  .nb-brand-title{
    font-family:'Lora',serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.02em;
    color:#F1E8D2;
    margin:0;
  }
  .nb-brand-sub{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
    margin-top:3px;
  }

  .nb-search-wrap{
    padding:0 16px 14px 32px;
  }
  .nb-search{
    width:100%;
    background:rgba(0,0,0,0.18);
    border:1px solid rgba(208,193,149,0.25);
    border-radius:7px;
    padding:8px 10px;
    color:#F1E8D2;
    font-size:13px;
    font-family:'Inter',sans-serif;
  }
  .nb-search::placeholder{color:rgba(241,232,210,0.45);}
  .nb-search:focus{outline:2px solid var(--brass-light);outline-offset:1px;}

  .nb-newbtn{
    margin:0 16px 16px 32px;
    background:var(--brass);
    color:var(--cover-dark);
    border:none;
    border-radius:7px;
    padding:9px 12px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    justify-content:center;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .nb-newbtn:hover{background:var(--brass-light);}
  .nb-newbtn:active{transform:scale(0.98);}
  .nb-newbtn:focus-visible{outline:2px solid #F1E8D2;outline-offset:2px;}

  .nb-list{
    flex:1;
    overflow-y:auto;
    padding:0 0 16px 0;
  }
  .nb-list::-webkit-scrollbar{width:8px;}
  .nb-list::-webkit-scrollbar-thumb{background:rgba(208,193,149,0.25);border-radius:4px;}

  .nb-tab{
    position:relative;
    margin:0 14px 8px 30px;
    background:rgba(246,241,228,0.06);
    border:1px solid rgba(208,193,149,0.16);
    border-radius:6px 3px 3px 6px;
    padding:10px 12px 10px 14px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .nb-tab:hover{background:rgba(246,241,228,0.11);}
  .nb-tab:focus-visible{outline:2px solid var(--brass-light);outline-offset:1px;}
  .nb-tab.active{
    background:var(--paper);
    border-color:var(--paper);
  }
  .nb-tab.active::after{
    content:'';
    position:absolute;
    right:-13px;
    top:50%;
    transform:translateY(-50%);
    width:0;height:0;
    border-top:9px solid transparent;
    border-bottom:9px solid transparent;
    border-left:13px solid var(--ribbon);
  }
  .nb-tab-title{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:13.5px;
    color:#F1E8D2;
    margin:0 0 3px 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .nb-tab.active .nb-tab-title{color:var(--cover-dark);}
  .nb-tab-snippet{
    font-size:11.5px;
    color:rgba(241,232,210,0.55);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin:0;
  }
  .nb-tab.active .nb-tab-snippet{color:var(--ink-soft);}
  .nb-tab-date{
    font-size:10px;
    color:rgba(241,232,210,0.35);
    margin-top:4px;
    letter-spacing:0.03em;
  }
  .nb-tab.active .nb-tab-date{color:#9C8F6E;}

  .nb-empty-list{
    margin:10px 16px 0 30px;
    color:rgba(241,232,210,0.45);
    font-size:12.5px;
    line-height:1.5;
  }

  /* ---------- PAPER / EDITOR ---------- */
  .nb-paper{
    flex:1;
    background:
      repeating-linear-gradient(
        var(--paper),
        var(--paper) 31px,
        var(--paper-line) 32px
      );
    background-attachment:local;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .nb-paper-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 34px 0 34px;
    background:var(--paper);
  }
  .nb-status{
    font-size:11.5px;
    color:var(--ink-soft);
    font-style:italic;
    font-family:'Source Serif 4',serif;
    min-width:110px;
    text-align:right;
  }
  .nb-status.saving{color:var(--sage);}

  .nb-delete{
    background:none;
    border:1px solid transparent;
    color:var(--ink-soft);
    font-size:12px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    padding:6px 10px;
    border-radius:5px;
    transition:all 0.15s ease;
  }
  .nb-delete:hover{color:var(--ribbon);background:rgba(139,58,58,0.08);}
  .nb-delete.confirming{
    color:#fff;
    background:var(--ribbon);
  }
  .nb-delete:focus-visible{outline:2px solid var(--ribbon);outline-offset:1px;}

  .nb-title-input{
    width:100%;
    border:none;
    background:transparent;
    font-family:'Lora',serif;
    font-weight:700;
    font-size:26px;
    color:var(--ink);
    padding:8px 34px 6px 34px;
    line-height:1.3;
  }
  .nb-title-input::placeholder{color:#B8AE8F;}
  .nb-title-input:focus{outline:none;}

  .nb-content{
    flex:1;
    width:100%;
    border:none;
    resize:none;
    background:transparent;
    font-family:'Source Serif 4',serif;
    font-size:15.5px;
    line-height:32px;
    color:var(--ink);
    padding:0 34px 24px 34px;
  }
  .nb-content::placeholder{color:#B8AE8F;font-style:italic;}
  .nb-content:focus{outline:none;}

  .nb-blank-state{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:var(--paper);
    padding:40px;
    text-align:center;
  }
  .nb-blank-title{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:19px;
    color:var(--ink);
    margin:0 0 8px 0;
  }
  .nb-blank-sub{
    font-family:'Source Serif 4',serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
    max-width:280px;
  }

  @media (prefers-reduced-motion: reduce){
    .nb-newbtn, .nb-tab, .nb-delete{transition:none;}
  }

  @media (max-width:520px){
    .nb-root{flex-direction:column;height:100vh;}
    .nb-spine{width:100%;max-height:200px;border-right:none;border-bottom:6px solid var(--cover-dark);}
    .nb-title-input{font-size:21px;padding-left:20px;padding-right:20px;}
    .nb-content{padding-left:20px;padding-right:20px;}
    .nb-paper-header{padding-left:20px;padding-right:20px;}
    .nb-brand,.nb-search-wrap,.nb-newbtn,.nb-tab{margin-left:0;padding-left:16px;}
    .nb-spine::before{display:none;}
  }
</style>
</head>
<body>


<div class="nb-root" id="nbRoot">
  <div class="nb-spine">
    <div class="nb-brand">
      <p class="nb-brand-title">The Notebook</p>
      <p class="nb-brand-sub">Your pages, kept safe</p>
    </div>
    <div class="nb-search-wrap">
      <input class="nb-search" id="nbSearch" type="text" placeholder="Search notes..." />
    </div>
    <button class="nb-newbtn" id="nbNewBtn">+ New page</button>
    <div class="nb-list" id="nbList"></div>
  </div>
  <div id="nbEditorArea" style="flex:1;display:flex;flex-direction:column;"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'notes-data';
  let notes = [];
  let activeId = null;
  let searchTerm = '';
  let confirmingDeleteId = null;
  let saveTimer = null;
  let loaded = false;

  const listEl = document.getElementById('nbList');
  const editorArea = document.getElementById('nbEditorArea');
  const searchInput = document.getElementById('nbSearch');
  const newBtn = document.getElementById('nbNewBtn');

  function uid(){
    return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function formatDate(ts){
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if(sameDay){
      return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    }
    return d.toLocaleDateString([], {month:'short', day:'numeric'});
  }

  function snippetOf(content){
    const clean = (content || '').replace(/\s+/g,' ').trim();
    return clean.length ? clean.slice(0,60) : 'No content yet';
  }

  async function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }catch(e){
      console.error('Failed to save notes', e);
    }
  }

  async function loadNotes(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      notes = raw ? JSON.parse(raw) : [];
    }catch(e){
      notes = [];
    }
    if(notes.length === 0){
      notes = [{
        id: uid(),
        title: 'Welcome to your notebook',
        content: 'This is your first page.\n\nWrite anything here — ideas, drafts, to-do lists. Everything you type saves automatically, and it will still be here the next time you open this notebook.\n\nUse "+ New page" on the left to start another note, or the search box to find one later.',
        updatedAt: Date.now()
      }];
      await persist();
    }
    activeId = notes[0].id;
    loaded = true;
    render();
  }

  function newNote(){
    const note = { id: uid(), title: '', content: '', updatedAt: Date.now() };
    notes.unshift(note);
    activeId = note.id;
    persist();
    render();
    setTimeout(() => {
      const titleInput = document.getElementById('nbTitleInput');
      if(titleInput) titleInput.focus();
    }, 0);
  }

  function selectNote(id){
    activeId = id;
    confirmingDeleteId = null;
    render();
  }

  function deleteNote(id){
    if(confirmingDeleteId !== id){
      confirmingDeleteId = id;
      render();
      return;
    }
    const idx = notes.findIndex(n => n.id === id);
    notes = notes.filter(n => n.id !== id);
    confirmingDeleteId = null;
    if(activeId === id){
      activeId = notes.length ? (notes[Math.min(idx, notes.length-1)] || notes[0]).id : null;
    }
    persist();
    render();
  }

  function updateActiveNote(field, value){
    const note = notes.find(n => n.id === activeId);
    if(!note) return;
    note[field] = value;
    note.updatedAt = Date.now();
    renderList();
    renderStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      await persist();
      renderStatus('saved');
    }, 500);
  }

  function renderStatus(state){
    const statusEl = document.getElementById('nbStatus');
    if(!statusEl) return;
    if(state === 'saving'){
      statusEl.textContent = 'Saving...';
      statusEl.classList.remove('saving');
    } else {
      statusEl.textContent = 'Saved';
      statusEl.classList.add('saving');
    }
  }

  function filteredNotes(){
    if(!searchTerm.trim()) return notes.slice().sort((a,b) => b.updatedAt - a.updatedAt);
    const t = searchTerm.toLowerCase();
    return notes
      .filter(n => (n.title || '').toLowerCase().includes(t) || (n.content || '').toLowerCase().includes(t))
      .sort((a,b) => b.updatedAt - a.updatedAt);
  }

  function renderList(){
    const items = filteredNotes();
    if(items.length === 0){
      listEl.innerHTML = '<div class="nb-empty-list">' +
        (searchTerm.trim() ? 'No pages match your search.' : 'No pages yet. Start one above.') +
        '</div>';
      return;
    }
    listEl.innerHTML = items.map(n => {
      const isActive = n.id === activeId;
      const title = (n.title || 'Untitled page').replace(/</g,'&lt;');
      const snippet = snippetOf(n.content).replace(/</g,'&lt;');
      return '<div class="nb-tab' + (isActive ? ' active' : '') + '" tabindex="0" role="button" data-id="' + n.id + '">' +
        '<p class="nb-tab-title">' + title + '</p>' +
        '<p class="nb-tab-snippet">' + snippet + '</p>' +
        '<div class="nb-tab-date">' + formatDate(n.updatedAt) + '</div>' +
        '</div>';
    }).join('');

    Array.from(listEl.querySelectorAll('.nb-tab')).forEach(el => {
      el.addEventListener('click', () => selectNote(el.getAttribute('data-id')));
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          selectNote(el.getAttribute('data-id'));
        }
      });
    });
  }

  function renderEditor(){
    const note = notes.find(n => n.id === activeId);
    if(!note){
      editorArea.innerHTML = '<div class="nb-blank-state">' +
        '<p class="nb-blank-title">No page open</p>' +
        '<p class="nb-blank-sub">Choose a page from the list, or start a new one to begin writing.</p>' +
        '</div>';
      return;
    }
    const isConfirming = confirmingDeleteId === note.id;
    editorArea.innerHTML =
      '<div class="nb-paper">' +
        '<div class="nb-paper-header">' +
          '<button class="nb-delete' + (isConfirming ? ' confirming' : '') + '" id="nbDeleteBtn">' +
            (isConfirming ? 'Click again to delete' : 'Delete page') +
          '</button>' +
          '<span class="nb-status" id="nbStatus">Saved</span>' +
        '</div>' +
        '<input class="nb-title-input" id="nbTitleInput" type="text" placeholder="Untitled page" />' +
        '<textarea class="nb-content" id="nbContentInput" placeholder="Start writing..."></textarea>' +
      '</div>';

    const titleInput = document.getElementById('nbTitleInput');
    const contentInput = document.getElementById('nbContentInput');
    titleInput.value = note.title || '';
    contentInput.value = note.content || '';

    titleInput.addEventListener('input', (e) => updateActiveNote('title', e.target.value));
    contentInput.addEventListener('input', (e) => updateActiveNote('content', e.target.value));

    document.getElementById('nbDeleteBtn').addEventListener('click', () => deleteNote(note.id));
  }

  function render(){
    if(!loaded) return;
    renderList();
    renderEditor();
  }

  newBtn.addEventListener('click', newNote);
  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderList();
  });

  loadNotes();
})();
</script>

</body>
</html>
